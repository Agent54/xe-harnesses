name: harness-kimi-code
services:
  kimi-code:
    build: .
    init: true
    logging:
      driver: local
    stdin_open: true
    tty: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      KIMI_MODEL_NAME: ${KIMI_MODEL_NAME:-}
      KIMI_MODEL_API_KEY: ${KIMI_MODEL_API_KEY:-}
      KIMI_MODEL_PROVIDER_TYPE: ${KIMI_MODEL_PROVIDER_TYPE:-kimi}
      KIMI_MODEL_BASE_URL: ${KIMI_MODEL_BASE_URL:-https://api.moonshot.ai/v1}
      KIMI_MODEL_MAX_CONTEXT_SIZE: ${KIMI_MODEL_MAX_CONTEXT_SIZE:-262144}
    # Interactive CLI: docker compose run --rm kimi-code
