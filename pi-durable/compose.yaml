name: harness-pi-durable
services:
  pi-durable:
    build: .
    init: true
    logging:
      driver: local
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:8080:8080"]
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-https://pi-durable_harness-pi-durable.app.localhost}
      PI_TOKEN: ${PI_TOKEN:?Set PI_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY}
      PI_MODEL: ${PI_MODEL:-gpt-6-sol}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
    stop_grace_period: 30s
