name: harness-openwork
services:
  openwork:
    build: .
    init: true
    logging:
      driver: local
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:8780:8780"]
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-https://openwork_harness-openwork.app.localhost}
      OPENWORK_TOKEN: ${OPENWORK_TOKEN:?Set OPENWORK_TOKEN}
      OPENWORK_HOST_TOKEN: ${OPENWORK_HOST_TOKEN:?Set OPENWORK_HOST_TOKEN to a different value}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8780/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 120s
    stop_grace_period: 30s
