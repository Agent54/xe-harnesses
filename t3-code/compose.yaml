name: harness-t3-code
services:
  t3-code:
    build: .
    init: true
    logging:
      driver: local
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:3773:3773"]
    environment:
      # T3 derives browser URLs from the proxy's Host / X-Forwarded-* headers.
      # This explicit value also makes the external address available to agents.
      PUBLIC_URL: ${PUBLIC_URL:-https://t3-code_harness-t3-code.app.localhost}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GH_TOKEN: ${GH_TOKEN:-}
    stop_grace_period: 30s
