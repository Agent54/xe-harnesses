name: harness-trueforge
services:
  trueforge:
    build: .
    init: true
    logging:
      driver: local
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:8790:8790"]
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-https://trueforge_harness-trueforge.app.localhost}
      PUBLIC_BASE_URL: ${PUBLIC_URL:-https://trueforge_harness-trueforge.app.localhost}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8790/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
    stop_grace_period: 35s
